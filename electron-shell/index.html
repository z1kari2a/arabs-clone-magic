<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <title>تفعيل ERP</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0; min-height: 100vh; font-family: "Segoe UI", Tahoma, Arial, sans-serif;
        background: linear-gradient(135deg, #0f172a 0%, #1e293b 60%, #334155 100%);
        color: #e2e8f0; display: grid; place-items: center; padding: 32px;
      }
      .card {
        width: 100%; max-width: 480px; background: rgba(15,23,42,.85);
        border: 1px solid rgba(148,163,184,.2); border-radius: 16px; padding: 32px;
        box-shadow: 0 25px 50px -12px rgba(0,0,0,.5); backdrop-filter: blur(10px);
      }
      h1 { margin: 0 0 6px; font-size: 22px; }
      p.sub { margin: 0 0 24px; color: #94a3b8; font-size: 13px; }
      label { display: block; margin: 14px 0 6px; font-size: 13px; color: #cbd5e1; }
      input {
        width: 100%; padding: 12px 14px; background: #0f172a; color: #f1f5f9;
        border: 1px solid #334155; border-radius: 8px; font-size: 15px; font-family: inherit;
        text-align: center; letter-spacing: 2px;
      }
      input:focus { outline: 2px solid #3b82f6; outline-offset: 0; border-color: #3b82f6; }
      button {
        width: 100%; margin-top: 20px; padding: 12px 16px; border: 0; border-radius: 8px;
        background: linear-gradient(180deg, #3b82f6, #1d4ed8); color: #fff; font-weight: 600;
        font-size: 15px; cursor: pointer; font-family: inherit;
      }
      button:disabled { opacity: .6; cursor: not-allowed; }
      .fp { margin-top: 20px; padding: 10px; background: #020617; border-radius: 6px;
            font-family: ui-monospace, monospace; font-size: 11px; color: #64748b;
            word-break: break-all; direction: ltr; text-align: left; }
      .msg { margin-top: 14px; padding: 10px; border-radius: 6px; font-size: 13px; text-align: center; }
      .msg.err { background: rgba(239,68,68,.15); color: #fca5a5; border: 1px solid rgba(239,68,68,.3); }
      .msg.ok  { background: rgba(34,197,94,.15); color: #86efac; border: 1px solid rgba(34,197,94,.3); }
      .footer { margin-top: 20px; text-align: center; font-size: 11px; color: #64748b; }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>تفعيل نظام ERP</h1>
      <p class="sub">أدخل رمز التفعيل الذي حصلت عليه لتنزيل ملفات البرنامج على هذا الجهاز.</p>

      <label for="name">اسم الجهاز (اختياري)</label>
      <input id="name" placeholder="مثال: مكتب المحاسبة" />

      <label for="code">رمز التفعيل</label>
      <input id="code" placeholder="XXXX-XXXX-XXXX-XXXX" autocomplete="off" spellcheck="false" />

      <button id="btn">تفعيل وتنزيل البرنامج</button>

      <div id="msg"></div>

      <div class="fp">
        <div style="color:#94a3b8; text-align:right; margin-bottom:4px; letter-spacing:0;">بصمة الجهاز:</div>
        <span id="fp">...</span>
      </div>

      <div class="footer">هذه البصمة تُربط بالرمز — لا يمكن استخدامه على جهاز آخر.</div>
    </div>

    <script>
      const $ = (id) => document.getElementById(id);
      const msg = (text, kind) => { $("msg").className = "msg " + kind; $("msg").textContent = text; };

      const errMap = {
        invalid_code: "الرمز غير صحيح.",
        license_disabled: "هذا الترخيص معطّل.",
        license_expired: "انتهت صلاحية الاشتراك.",
        device_limit_reached: "تم الوصول للحد الأقصى من الأجهزة لهذا الرمز.",
        device_revoked: "تم إلغاء صلاحية هذا الجهاز.",
        invalid_input: "بيانات الإدخال غير صحيحة.",
        invalid_session: "الجلسة غير صالحة — يرجى إعادة التفعيل.",
      };

      window.erpLicense.fingerprint().then((fp) => { $("fp").textContent = fp; });

      $("btn").addEventListener("click", async () => {
        const code = $("code").value.trim();
        const name = $("name").value.trim();
        if (code.length < 4) { msg("الرجاء إدخال رمز التفعيل.", "err"); return; }
        $("btn").disabled = true;
        msg("جارٍ التفعيل وتنزيل البرنامج...", "ok");
        const res = await window.erpLicense.activate(code, name);
        if (res.ok) { msg("تم التفعيل بنجاح — سيتم فتح البرنامج الآن.", "ok"); }
        else { msg(errMap[res.error] || ("فشل التفعيل: " + res.error), "err"); $("btn").disabled = false; }
      });

      $("code").addEventListener("keydown", (e) => { if (e.key === "Enter") $("btn").click(); });
    </script>
  </body>
</html>
