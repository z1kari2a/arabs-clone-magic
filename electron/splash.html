<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <!-- Startup window shown while the renderer boots. Deliberately has no
         network dependency and no script: it must paint on the first frame. -->
    <title>ERP</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        font-family: "Segoe UI", system-ui, sans-serif;
        color: #e2e8f0;
        background: radial-gradient(120% 120% at 50% 0%, #1e293b 0%, #0f172a 70%);
        border: 1px solid #334155;
        user-select: none;
        cursor: default;
      }
      .mark {
        width: 74px;
        height: 74px;
        display: grid;
        place-items: center;
        border-radius: 18px;
        background: linear-gradient(140deg, #2563eb, #1d4ed8);
        box-shadow: 0 12px 30px rgba(37, 99, 235, 0.35);
        font-size: 30px;
        font-weight: 700;
        letter-spacing: 1px;
        color: #fff;
      }
      h1 { font-size: 19px; font-weight: 600; }
      p { font-size: 12.5px; color: #94a3b8; }
      .bar {
        width: 190px;
        height: 3px;
        border-radius: 3px;
        background: #1e293b;
        overflow: hidden;
      }
      .bar::after {
        content: "";
        display: block;
        width: 40%;
        height: 100%;
        border-radius: 3px;
        background: #3b82f6;
        animation: slide 1.1s ease-in-out infinite;
      }
      @keyframes slide {
        0%   { transform: translateX(120%); }
        100% { transform: translateX(-190%); }
      }
    </style>
  </head>
  <body>
    <div class="mark">ERP</div>
    <h1>نظام المشتريات</h1>
    <div class="bar"></div>
    <p>جارٍ تشغيل البرنامج…</p>
  </body>
</html>
