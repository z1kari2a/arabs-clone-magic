<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F2A47"/>
      <stop offset="100%" stop-color="#134E4A"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5C451"/>
      <stop offset="100%" stop-color="#E0A526"/>
    </linearGradient>
    <linearGradient id="boxTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E4ECF3"/>
    </linearGradient>
    <linearGradient id="boxLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C9D6E3"/>
      <stop offset="100%" stop-color="#9FB2C6"/>
    </linearGradient>
    <linearGradient id="boxRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EDF2F7"/>
      <stop offset="100%" stop-color="#D3DEE8"/>
    </linearGradient>
  </defs>

  <!-- App icon background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- subtle inner glow ring -->
  <rect x="8" y="8" width="496" height="496" rx="106" fill="none" stroke="#ffffff" stroke-opacity="0.06" stroke-width="2"/>

  <!-- 3D crate / shipping box (trading & purchasing) -->
  <g transform="translate(256,300)">
    <!-- left face -->
    <polygon points="-100,-10 0,45 0,145 -100,90" fill="url(#boxLeft)"/>
    <!-- right face -->
    <polygon points="100,-10 0,45 0,145 100,90" fill="url(#boxRight)"/>
    <!-- top face -->
    <polygon points="-100,-10 0,-65 100,-10 0,45" fill="url(#boxTop)"/>

    <!-- seams -->
    <line x1="-100" y1="-10" x2="0" y2="45" stroke="#8FA3B8" stroke-width="3" stroke-opacity="0.5"/>
    <line x1="100" y1="-10" x2="0" y2="45" stroke="#8FA3B8" stroke-width="3" stroke-opacity="0.5"/>
    <line x1="0" y1="45" x2="0" y2="145" stroke="#8FA3B8" stroke-width="3" stroke-opacity="0.5"/>

    <!-- gold strap accents forming a subtle currency mark -->
    <line x1="-50" y1="12" x2="-50" y2="112" stroke="url(#gold)" stroke-width="10" stroke-linecap="round"/>
    <line x1="50" y1="12" x2="50" y2="112" stroke="url(#gold)" stroke-width="10" stroke-linecap="round"/>
  </g>

  <!-- Rising cost/analytics line above the crate -->
  <g transform="translate(256,175)" stroke="url(#gold)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <polyline points="-96,40 -48,4 0,26 48,-30 96,-58"/>
  </g>
  <g transform="translate(256,175)">
    <circle cx="-96" cy="40" r="9" fill="#F5C451"/>
    <circle cx="-48" cy="4" r="9" fill="#F5C451"/>
    <circle cx="0" cy="26" r="9" fill="#F5C451"/>
    <circle cx="48" cy="-30" r="9" fill="#F5C451"/>
    <circle cx="96" cy="-58" r="9" fill="#F5C451"/>
  </g>
</svg>
